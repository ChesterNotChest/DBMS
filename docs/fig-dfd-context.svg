<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .entity { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; rx: 8; ry: 8; }
      .process { fill: #eef4ff; stroke: #3057a6; stroke-width: 2.5; rx: 28; ry: 28; }
      .store { fill: #f5faf7; stroke: #2f7a45; stroke-width: 2; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 22px; font-weight: 700; fill: #1f2a37; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #1f2a37; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #4b5563; }
      .flow { stroke: #2f3a4a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowMuted); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f3a4a"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="720"/>
  <text class="title" x="700" y="44" text-anchor="middle">DFD 上下文图</text>

  <rect class="entity" x="90" y="150" width="210" height="90"/>
  <text class="label" x="195" y="190" text-anchor="middle">GUI 用户</text>
  <text class="small" x="195" y="216" text-anchor="middle">图形化管理操作</text>

  <rect class="entity" x="90" y="470" width="210" height="90"/>
  <text class="label" x="195" y="510" text-anchor="middle">CLI 用户</text>
  <text class="small" x="195" y="536" text-anchor="middle">命令行 SQL 输入</text>

  <rect class="process" x="500" y="210" width="400" height="210"/>
  <text class="title" x="700" y="280" text-anchor="middle">0 DBMS</text>
  <text class="label" x="700" y="315" text-anchor="middle">本地文件式数据库管理系统</text>
  <text class="small" x="700" y="346" text-anchor="middle">会话、认证、SQL 解析、服务执行、结果展示</text>

  <rect class="store" x="1060" y="145" width="230" height="90"/>
  <line x1="1085" y1="145" x2="1085" y2="235" stroke="#2f7a45" stroke-width="2"/>
  <line x1="1265" y1="145" x2="1265" y2="235" stroke="#2f7a45" stroke-width="2"/>
  <text class="label" x="1175" y="184" text-anchor="middle">D1 统一数据目录</text>
  <text class="small" x="1175" y="210" text-anchor="middle">root.dbf / db / table files</text>

  <rect class="store" x="1060" y="450" width="230" height="90"/>
  <line x1="1085" y1="450" x2="1085" y2="540" stroke="#2f7a45" stroke-width="2"/>
  <line x1="1265" y1="450" x2="1265" y2="540" stroke="#2f7a45" stroke-width="2"/>
  <text class="label" x="1175" y="489" text-anchor="middle">D2 认证库</text>
  <text class="small" x="1175" y="515" text-anchor="middle">__dbms_auth</text>

  <path class="flow" d="M300 180 L500 260"/>
  <text class="small" x="390" y="200" text-anchor="middle">SQL / 界面操作</text>

  <path class="flow" d="M500 340 L300 220"/>
  <text class="small" x="392" y="302" text-anchor="middle">结构树 / 表格 / 日志</text>

  <path class="flow" d="M300 515 L500 360"/>
  <text class="small" x="392" y="458" text-anchor="middle">SQL 命令 / 登录信息</text>

  <path class="flow" d="M500 395 L300 545"/>
  <text class="small" x="390" y="538" text-anchor="middle">文本结果 / 错误信息</text>

  <path class="flow" d="M900 260 L1060 190"/>
  <text class="small" x="985" y="206" text-anchor="middle">数据读写</text>

  <path class="flow" d="M1060 215 L900 350"/>
  <text class="small" x="992" y="313" text-anchor="middle">表结构 / 行数据</text>

  <path class="muted" d="M900 360 L1060 495"/>
  <text class="small" x="990" y="462" text-anchor="middle">用户与权限写入</text>

  <path class="muted" d="M1060 475 L900 300"/>
  <text class="small" x="990" y="376" text-anchor="middle">认证与授权信息</text>
</svg>
