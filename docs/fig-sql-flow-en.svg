<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="SQL execution flow">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .box { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; rx: 12; ry: 12; }
      .accent { fill: #eef4ff; stroke: #3057a6; stroke-width: 2; rx: 12; ry: 12; }
      .result { fill: #f7fbf2; stroke: #547a2e; stroke-width: 2; rx: 12; ry: 12; }
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2a37; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; fill: #1f2a37; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #4b5563; }
      .arrow { stroke: #2f3a4a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #547a2e; stroke-width: 3; fill: none; marker-end: url(#returnArrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f3a4a"/>
    </marker>
    <marker id="returnArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#547a2e"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="620"/>
  <text class="title" x="700" y="42" text-anchor="middle">SQL Execution Flow</text>

  <rect class="accent" x="55" y="92" width="190" height="90"/>
  <text class="label" x="150" y="136" text-anchor="middle">SQL text</text>

  <rect class="box" x="275" y="82" width="180" height="110"/>
  <text class="label" x="365" y="124" text-anchor="middle">Tokenizer / Parser</text>
  <text class="small" x="365" y="148" text-anchor="middle">ParseResult</text>

  <rect class="box" x="500" y="72" width="210" height="130"/>
  <text class="label" x="605" y="110" text-anchor="middle">SqlDispatcher</text>
  <text class="small" x="605" y="136" text-anchor="middle">Dispatch by commandType</text>
  <text class="small" x="605" y="160" text-anchor="middle">Keep command boundaries</text>

  <rect class="box" x="760" y="60" width="260" height="160"/>
  <text class="label" x="890" y="88" text-anchor="middle">Service layer</text>
  <text class="small" x="890" y="116" text-anchor="middle">DatabaseService / TableService</text>
  <text class="small" x="890" y="140" text-anchor="middle">TupleService / AuthService</text>
  <text class="small" x="890" y="164" text-anchor="middle">Logic / Constraint / Index</text>

  <rect class="box" x="1070" y="78" width="200" height="120"/>
  <text class="label" x="1170" y="108" text-anchor="middle">Repo / Cache / Lock</text>
  <text class="small" x="1170" y="136" text-anchor="middle">File I/O and consistency</text>

  <rect class="result" x="745" y="286" width="250" height="90"/>
  <text class="label" x="870" y="320" text-anchor="middle">SqlExecResult</text>
  <text class="small" x="870" y="346" text-anchor="middle">Unified result object</text>

  <rect class="accent" x="1080" y="284" width="210" height="70"/>
  <text class="label" x="1185" y="318" text-anchor="middle">CLI text formatter</text>

  <rect class="accent" x="1080" y="404" width="210" height="70"/>
  <text class="label" x="1185" y="438" text-anchor="middle">GUI result panel / log</text>

  <rect class="box" x="95" y="476" width="280" height="110"/>
  <text class="label" x="235" y="510" text-anchor="middle">Test entry point</text>
  <text class="small" x="235" y="538" text-anchor="middle">Unit / integration / stress tests</text>
  <text class="small" x="235" y="562" text-anchor="middle">Reuse the same execution path</text>

  <path class="arrow" d="M245 137 L275 137"/>
  <path class="arrow" d="M455 137 L500 137"/>
  <path class="arrow" d="M710 137 L760 137"/>
  <path class="arrow" d="M1020 137 L1070 137"/>
  <path class="return" d="M1170 198 C1170 260 970 270 900 286"/>
  <path class="return" d="M995 331 L1080 319"/>
  <path class="return" d="M995 344 C1060 375 1070 420 1080 438"/>
  <path class="arrow" d="M235 476 C250 365 490 278 745 331"/>
  <text class="small" x="1000" y="252">Same result object</text>
</svg>
