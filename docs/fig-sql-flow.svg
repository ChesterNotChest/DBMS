<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .node { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; rx: 14; ry: 14; }
      .service { fill: #eef4ff; stroke: #3057a6; stroke-width: 2; rx: 14; ry: 14; }
      .result { fill: #f5faf7; stroke: #2f7a45; stroke-width: 2; rx: 14; ry: 14; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; font-weight: 700; fill: #1f2a37; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #1f2a37; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #4b5563; }
      .arrow { stroke: #2f3a4a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f3a4a"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="700" y="42" text-anchor="middle">SQL 执行链路</text>

  <rect class="node" x="70" y="90" width="160" height="80"/>
  <text class="label" x="150" y="136" text-anchor="middle">SQL 文本</text>

  <rect class="node" x="270" y="90" width="190" height="80"/>
  <text class="label" x="365" y="124" text-anchor="middle">Tokenizer / Parser</text>
  <text class="small" x="365" y="148" text-anchor="middle">ParseResult</text>

  <rect class="service" x="500" y="70" width="210" height="120"/>
  <text class="label" x="605" y="110" text-anchor="middle">SqlDispatcher</text>
  <text class="small" x="605" y="136" text-anchor="middle">按 commandType 分发</text>
  <text class="small" x="605" y="160" text-anchor="middle">维护命令入口边界</text>

  <rect class="service" x="760" y="50" width="260" height="160"/>
  <text class="label" x="890" y="88" text-anchor="middle">服务层</text>
  <text class="small" x="890" y="116" text-anchor="middle">DatabaseService / TableService</text>
  <text class="small" x="890" y="140" text-anchor="middle">TupleService / AuthService</text>
  <text class="small" x="890" y="164" text-anchor="middle">Logic / Constraint / Index</text>

  <rect class="node" x="1060" y="70" width="220" height="120"/>
  <text class="label" x="1170" y="108" text-anchor="middle">Repo / Cache / Lock</text>
  <text class="small" x="1170" y="136" text-anchor="middle">文件读写与一致性控制</text>

  <rect class="result" x="760" y="280" width="220" height="110"/>
  <text class="label" x="870" y="320" text-anchor="middle">SqlExecResult</text>
  <text class="small" x="870" y="346" text-anchor="middle">统一结果对象</text>

  <rect class="service" x="1060" y="270" width="250" height="80"/>
  <text class="label" x="1185" y="318" text-anchor="middle">CLI text formatter</text>

  <rect class="service" x="1060" y="390" width="250" height="80"/>
  <text class="label" x="1185" y="438" text-anchor="middle">GUI result panel / log</text>

  <rect class="node" x="70" y="470" width="330" height="120"/>
  <text class="label" x="235" y="510" text-anchor="middle">测试入口</text>
  <text class="small" x="235" y="538" text-anchor="middle">单元测试 / 集成测试 / 压力测试</text>
  <text class="small" x="235" y="562" text-anchor="middle">直接复用同一条执行链路</text>

  <path class="arrow" d="M230 130 L270 130"/>
  <path class="arrow" d="M460 130 L500 130"/>
  <path class="arrow" d="M710 130 L760 130"/>
  <path class="arrow" d="M1020 130 L1060 130"/>
  <path class="arrow" d="M890 210 L890 280"/>
  <path class="arrow" d="M980 335 L1060 310"/>
  <path class="arrow" d="M980 345 L1060 430"/>
  <path class="arrow" d="M150 470 L150 210"/>
  <path class="arrow" d="M235 470 L500 210"/>
  <path class="arrow" d="M980 335 L980 210"/>
  <text class="small" x="1000" y="252">同一结果对象</text>
</svg>
